name: Publish palette site
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: palette-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - run: python -m pip install -r requirements-qa.txt
      - run: python scripts/build_distribution.py "$RUNNER_TEMP/academic-distribution"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/academic-distribution/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy palette site
        id: deployment
        uses: actions/deploy-pages@v4
