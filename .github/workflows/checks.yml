name: Release regression
env:
  PYTHONUTF8: "1"
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12']
        include:
          - os: ubuntu-24.04
            python: '3.10'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-qa.txt
      - run: python -B -m unittest discover -s tests -v
  full-render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          RENV_CONFIG_AUTOLOADER_ENABLED: 'FALSE'
        with:
          working-directory: assets/r-template
          packages: 'deps::.'
          dependencies: '"hard"'
          install-pandoc: 'false'
          install-quarto: 'false'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-qa.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locate Chrome for browser PDF export
        run: |
          chrome="$(command -v google-chrome)"
          "$chrome" --version
          echo "ACADEMIC_FIGURE_CHROMIUM=$chrome" >> "$GITHUB_ENV"
      - name: Test actual chart exports and browser PDF with all dependencies
        run: |
          python -B - <<'PY'
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover("tests")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.testsRun and result.wasSuccessful() and not result.skipped else 1)
          PY
