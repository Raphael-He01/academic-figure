name: Build tagged beta downloads
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  regression:
    uses: ./.github/workflows/checks.yml
  build:
    needs: regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match tag to source version
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - run: python -m pip install -r requirements-qa.txt
      - run: python scripts/build_distribution.py "$RUNNER_TEMP/academic-distribution"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            ${{ runner.temp }}/academic-distribution/*.zip
            ${{ runner.temp }}/academic-distribution/SHA256SUMS.txt
          if-no-files-found: error
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets
      - name: Attach verified files to the draft
        working-directory: assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          sha256sum --check SHA256SUMS.txt
          if gh release view "$GITHUB_REF_NAME" --json isDraft > "$RUNNER_TEMP/release-status.json"; then
            test "$(jq -r .isDraft "$RUNNER_TEMP/release-status.json")" = true
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --prerelease \
              --title "Academic Figure $GITHUB_REF_NAME" \
              --notes "完整试用请下载 Academic-Figure-Trial.zip，解压打开 START.html。只选配色请下载 Academic-Figure-Palettes.zip。第三方派生材料适用各自许可，详见随包说明。"
          fi
          gh release upload "$GITHUB_REF_NAME" Academic-Figure-Trial.zip Academic-Figure-Palettes.zip SHA256SUMS.txt --clobber
